<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
    default-src 'none';
    script-src 'nonce-{{scriptNonce}}' {{cspSource}};
    style-src {{cspSource}};
  "
    />
    <title>KiCad Netlist</title>
    <link rel="stylesheet" href="{{bomCssUri}}" />
  </head>
  <body class="netlist-view">
    <div id="bom-app">
      <div id="statsbar">
        <span id="summary-text" class="muted">No schematic opened.</span>
      </div>
      <div id="error-card" role="alert" aria-live="polite">
        <strong>Could not load netlist</strong>
        <span id="error-message"></span>
      </div>
      <output id="netlist-empty" aria-live="polite" hidden>
        <span id="netlist-empty-message"></span>
        <button id="netlist-empty-action" type="button" hidden>
          Open Review Tasks
        </button>
      </output>
      <div id="table-wrapper" tabindex="0" aria-label="Netlist table">
        <table>
          <thead>
            <tr>
              <th>Net</th>
              <th>Nodes</th>
            </tr>
          </thead>
          <tbody id="netlist-rows"></tbody>
        </table>
      </div>
    </div>
    <script nonce="{{scriptNonce}}" src="{{scriptUri}}"></script>
  </body>
</html>
