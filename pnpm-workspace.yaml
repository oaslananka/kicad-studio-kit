packages:
  - "apps/vscode-extension"
  - "packages/kicad-fixtures"
  - "packages/test-harness"

minimumReleaseAge: 10080
trustPolicy: no-downgrade
minimumReleaseAgeExclude:
  - tmp@0.2.7
  - qs@6.16.0
  - js-yaml@4.3.1
  - brace-expansion@2.1.4
  - brace-expansion@5.0.9
