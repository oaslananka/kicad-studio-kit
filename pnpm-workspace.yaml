packages:
  - "apps/vscode-extension"
  - "packages/kicad-fixtures"
  - "packages/test-harness"

minimumReleaseAge: 10080
trustPolicy: no-downgrade
minimumReleaseAgeExclude:
  - tmp@0.2.7
  - nanoid@3.3.18
  # Renovate security update: pnpm@11.11.0
  - pnpm@11.11.0
  # Security fix: source-map-js@1.2.2 (CVE-2026-xxxx)
  - source-map-js@1.2.2
  # Security fix: Handlebars GHSA-8r5x-fm3f-whwj and GHSA-p8wg-vrv2-v86f
  - handlebars@4.7.10
  # Security fix: follow-redirects cross-origin credential leaks (GHSA-q3jh-wrc6-jgq8, GHSA-8r9p-f939-6h3c)
  - follow-redirects@1.16.1
  # Security fix: Vite/launch-editor Windows cmd escaping (GHSA-698v-4r3x-3vcv) || 6.4.5
  - vite@6.4.4 || 6.4.5
  # Security fix: markdown-it algorithmic DoS (GHSA-gfr2-rv44-r23c)
  - markdown-it@14.3.3
  # Renovate security update: ip-address@10.7.4
  - ip-address@10.7.4
  # Oct 2026 security fixes newer than seven days: exact-version maturity exceptions.
  - fast-uri@3.1.9
  - serialize-javascript@7.1.3
trustPolicyExclude:
  - "@octokit/endpoint@9.0.6"
  - chokidar@4.0.3
  - "semver@5.7.2 || 6.3.1"
blockExoticSubdeps: true

allowBuilds:
  "@go-task/cli": true
  "@parcel/watcher": true
  "@vscode/vsce-sign": true
  esbuild: true
  unrs-resolver: true

ignoredOptionalDependencies:
  - keytar

overrides:
  "brace-expansion@2.1.1": 2.1.7
  "brace-expansion@5.0.6": 5.0.12
  "brace-expansion@5.0.7": 5.0.12
  "postcss@8.5.15": 8.5.28
  "nanoid@3.3.16": 3.3.19
  "nanoid@3.3.17": 3.3.19
  "@vscode/vsce>keytar": "-"
  encoding-sniffer: 1.0.2
  js-yaml: 4.3.2
  "@xmldom/xmldom": 0.9.12
  exceljs>archiver: 8.0.0
  exceljs>fast-csv: 5.0.7
  exceljs>unzipper: 0.12.5
  diff: 9.0.0
  esbuild: 0.28.2
  glob: 13.0.6
  mocha>serialize-javascript: 7.1.3
  qs: 6.16.0
  tar: 7.5.22
  test-exclude: 8.0.0
  form-data: 4.0.6
  fast-uri: 3.1.9
  linkify-it: 5.0.2
  ip-address: 10.7.4
  markdown-it: 14.3.3
  tmp: 0.2.7
  uuid: 14.0.2
  vite: 6.4.5
  undici: 7.30.1
  "@azure/msal-node": 7.1.0
  zod: 4.6.7
  "@vitest/mocker": 4.1.12
  follow-redirects: 1.16.1
  basic-ftp: ">=6.2.1"
  source-map-js: ">=1.2.2"
  "@vue/server-renderer": ">=3.5.42"
  "@vscode/vsce": "4.0.0"
