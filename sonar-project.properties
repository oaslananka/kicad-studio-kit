# SonarQube Cloud project (CI-based analysis; Automatic Analysis is disabled
# in the SonarQube Cloud project settings). Keep this in sync with the
# repository-owned quality gate policy and coverage-producing workflow.
sonar.organization=oaslananka
sonar.projectKey=oaslananka_kicad-studio-kit
sonar.sourceEncoding=UTF-8

# Explicitly classify product code and developer scripts vs test suites.
# Avoid treating test fixture files and generated build output as source code.
sonar.sources=apps/vscode-extension/src,apps/vscode-extension/scripts,packages/kicad-fixtures/src,packages/kicad-fixtures/scripts,packages/test-harness/src,packages/test-harness/scripts,scripts
sonar.tests=apps/vscode-extension/test,apps/vscode-extension/scripts,packages/kicad-fixtures/test,packages/test-harness/test,scripts
# The test-inclusion patterns also automatically exclude these files from
# Sonar's production-source scope. Binary screenshot goldens are not tests
# that a source-code analyzer should parse as UTF-8 text.
sonar.test.inclusions=apps/vscode-extension/test/**/*.ts,apps/vscode-extension/test/**/*.js,apps/vscode-extension/test/**/*.mjs,apps/vscode-extension/test/**/*.tsx,apps/vscode-extension/scripts/**/*.test.mjs,apps/vscode-extension/scripts/**/*.test.js,apps/vscode-extension/scripts/**/*.test.cjs,packages/kicad-fixtures/test/**/*.ts,packages/kicad-fixtures/test/**/*.js,packages/test-harness/test/**/*.ts,packages/test-harness/test/**/*.js,scripts/**/*.test.mjs

# Both reports are real execution-derived LCOV: Jest instruments the
# extension source; c8 instruments repository-owned scripts under Node test.
# Neither coverage nor duplicate-code thresholds are waived.
sonar.javascript.lcov.reportPaths=apps/vscode-extension/coverage/lcov.info,apps/vscode-extension/coverage/sonar-scripts/lcov.info
