name: KiCad Studio E2E Diagnostics

on:
  pull_request:
    paths:
      - 'apps/vscode-extension/**'
      - '.github/workflows/e2e-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kicad-studio-e2e-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: corepack prepare pnpm@11.6.0 --activate
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --filter kicadstudiokit run build
      - run: corepack pnpm --filter kicadstudiokit exec playwright install-deps chromium
      - name: Run Linux E2E viewer tests
        run: xvfb-run -a corepack pnpm --filter kicadstudiokit run test:e2e
      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-e2e-failure-results
          path: apps/vscode-extension/test-results
          if-no-files-found: error
          retention-days: 7
