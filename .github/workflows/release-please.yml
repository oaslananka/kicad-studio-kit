name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  pnpm_config_pm_on_fail: ignore

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Release Please's generated commit is not GitHub-signed, while main requires
      # signed commits. Use the canonical PR only as a short-lived generator: mirror
      # its complete release tree to one parseable GitHub-signed shadow PR, verify
      # that shadow, then close and delete the validated generator branch.
      - if: ${{ steps.release.outputs.pr }}
        id: release-pr
        name: Resolve the Release Please branch
        env:
          RELEASE_PR_JSON: ${{ steps.release.outputs.pr }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t release_metadata < <(node --input-type=module <<'NODE'
          const releasePr = JSON.parse(process.env.RELEASE_PR_JSON ?? "");
          const branch = releasePr.headBranchName;
          const title = releasePr.title;
          const number = releasePr.number;
          const invalidBranchCharacter =
            typeof branch === "string" &&
            [...branch].some((character) => {
              const code = character.codePointAt(0);
              return (
                code <= 0x20 ||
                code === 0x7f ||
                code === 0x5c ||
                "~^:?*[".includes(character)
              );
            });
          if (
            typeof branch !== "string" ||
            branch.length === 0 ||
            !branch.startsWith("release-please--branches--") ||
            invalidBranchCharacter ||
            branch.startsWith("-") ||
            branch.startsWith("/") ||
            branch.endsWith("/") ||
            branch.endsWith(".") ||
            branch.includes("..") ||
            branch.includes("@{") ||
            branch.includes("//")
          ) {
            throw new Error("Release Please returned an unsafe head branch name");
          }
          if (
            typeof title !== "string" ||
            !/^chore\(main\): release [a-z0-9._-]+ [0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$/u.test(title)
          ) {
            throw new Error("Release Please returned an unsafe release PR title");
          }
          if (!Number.isSafeInteger(number) || number <= 0) {
            throw new Error("Release Please returned an invalid PR number");
          }
          process.stdout.write(`${branch}\n${title}\n${number}\n`);
          NODE
          )
          if [[ "${#release_metadata[@]}" -ne 3 ]]; then
            echo "Release Please returned incomplete PR metadata" >&2
            exit 1
          fi
          {
            printf 'branch=%s\n' "${release_metadata[0]}"
            printf 'title=%s\n' "${release_metadata[1]}"
            printf 'number=%s\n' "${release_metadata[2]}"
          } >> "$GITHUB_OUTPUT"
      - if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ steps.release-pr.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      - if: ${{ steps.release.outputs.pr }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - if: ${{ steps.release.outputs.pr }}
        run: corepack enable
      - if: ${{ steps.release.outputs.pr }}
        run: corepack prepare pnpm@11.6.0 --activate
      - if: ${{ steps.release.outputs.pr }}
        run: corepack pnpm install --frozen-lockfile
      - if: ${{ steps.release.outputs.pr }}
        run: corepack pnpm run release:surface
      - if: ${{ steps.release.outputs.pr }}
        run: corepack pnpm run docs:generate
      - if: ${{ steps.release.outputs.pr }}
        name: Sync signed Release Please shadow PR
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_PR_NUMBER: ${{ steps.release-pr.outputs.number }}
          RELEASE_PR_BRANCH: ${{ steps.release-pr.outputs.branch }}
          RELEASE_TITLE: ${{ steps.release-pr.outputs.title }}
          SIGNED_RELEASE_BRANCH: release-please/branches/main/components/vscode-extension
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_BASE_SHA="$(git rev-parse origin/main)"
          RELEASE_BODY_FILE="$RUNNER_TEMP/release-pr-body.md"
          SIGNED_RELEASE_PR=""

          gh pr view "$RELEASE_PR_NUMBER" --json body --jq '.body // ""' \
            > "$RELEASE_BODY_FILE"

          if SIGNED_RELEASE_HEAD="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/$SIGNED_RELEASE_BRANCH" \
            --jq '.object.sha' 2>/dev/null)"; then
            mapfile -t signed_release_prs < <(
              gh pr list \
                --state open \
                --head "$SIGNED_RELEASE_BRANCH" \
                --json number \
                --jq '.[].number'
            )
            if [[ "${#signed_release_prs[@]}" -ne 1 ]]; then
              echo "Expected exactly one open signed release PR for existing shadow branch" >&2
              exit 1
            fi
            SIGNED_RELEASE_PR="${signed_release_prs[0]}"
            gh pr update-branch "$SIGNED_RELEASE_PR"
            SIGNED_RELEASE_SETTLED=false
            for attempt in $(seq 1 15); do
              git fetch --no-tags origin \
                "refs/heads/$SIGNED_RELEASE_BRANCH:refs/remotes/origin/$SIGNED_RELEASE_BRANCH"
              SIGNED_RELEASE_HEAD="$(git rev-parse \
                "refs/remotes/origin/$SIGNED_RELEASE_BRANCH")"
              if git merge-base --is-ancestor \
                "$RELEASE_BASE_SHA" \
                "$SIGNED_RELEASE_HEAD"; then
                SIGNED_RELEASE_SETTLED=true
                break
              fi
              echo "Signed release shadow update not settled (attempt $attempt/15); retrying" >&2
              sleep 2
            done
            if [[ "$SIGNED_RELEASE_SETTLED" != "true" ]]; then
              echo "Timed out waiting for signed release shadow to include current main" >&2
              exit 1
            fi
            SIGNED_RELEASE_VERIFIED="$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$SIGNED_RELEASE_HEAD" \
              --jq '.commit.verification.verified')"
            if [[ "$SIGNED_RELEASE_VERIFIED" != "true" ]]; then
              echo "Signed release shadow head is not GitHub-verified" >&2
              exit 1
            fi
            node scripts/create-github-signed-commit.mjs \
              --repository "$GITHUB_REPOSITORY" \
              --branch "$SIGNED_RELEASE_BRANCH" \
              --message "chore(kicad-studio): sync signed release surfaces"$'\n\nSigned-off-by: oaslananka <info@oaslananka.dev>' \
              --onto-head "$SIGNED_RELEASE_HEAD"
          else
            node scripts/create-github-signed-commit.mjs \
              --repository "$GITHUB_REPOSITORY" \
              --branch "$SIGNED_RELEASE_BRANCH" \
              --message "chore(kicad-studio): prepare signed release surfaces"$'\n\nSigned-off-by: oaslananka <info@oaslananka.dev>' \
              --create-from-base "$RELEASE_BASE_SHA"

            cleanup_new_shadow() {
              set +e
              if [[ -n "$SIGNED_RELEASE_PR" ]]; then
                gh pr close "$SIGNED_RELEASE_PR" >/dev/null 2>&1 || true
              fi
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/git/refs/heads/$SIGNED_RELEASE_BRANCH" \
                >/dev/null 2>&1 || true
            }
            trap cleanup_new_shadow ERR

            SIGNED_RELEASE_URL="$(gh pr create \
              --base main \
              --head "$SIGNED_RELEASE_BRANCH" \
              --title "$RELEASE_TITLE" \
              --body-file "$RELEASE_BODY_FILE")"
            SIGNED_RELEASE_PR="${SIGNED_RELEASE_URL##*/}"
          fi

          gh pr edit "$SIGNED_RELEASE_PR" \
            --title "$RELEASE_TITLE" \
            --body-file "$RELEASE_BODY_FILE" \
            --add-label "autorelease: pending"

          FINAL_SIGNED_RELEASE_HEAD="$(gh pr view "$SIGNED_RELEASE_PR" \
            --json headRefOid \
            --jq '.headRefOid')"
          FINAL_SIGNED_RELEASE_VERIFIED="$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$FINAL_SIGNED_RELEASE_HEAD" \
            --jq '.commit.verification.verified')"
          if [[ "$FINAL_SIGNED_RELEASE_VERIFIED" != "true" ]]; then
            echo "Final signed release shadow head is not GitHub-verified" >&2
            exit 1
          fi
          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/$SIGNED_RELEASE_BRANCH:refs/remotes/origin/$SIGNED_RELEASE_BRANCH"
          if ! git merge-base --is-ancestor \
            refs/remotes/origin/main \
            "refs/remotes/origin/$SIGNED_RELEASE_BRANCH"; then
            echo "Signed release shadow is not up to date with main" >&2
            exit 1
          fi
          # A newly-created shadow remains rollback-protected until its final
          # signature and ancestry checks succeed. Generator cleanup is a
          # separate phase and must never delete an already-valid shadow.
          trap - ERR

          GENERATOR_PR_BRANCH="$(gh pr view "$RELEASE_PR_NUMBER" \
            --json headRefName \
            --jq '.headRefName')"
          if [[ "$GENERATOR_PR_BRANCH" != "$RELEASE_PR_BRANCH" ]]; then
            echo "Generator PR branch changed before cleanup" >&2
            exit 1
          fi
          GENERATOR_PR_HEAD="$(gh pr view "$RELEASE_PR_NUMBER" \
            --json headRefOid \
            --jq '.headRefOid')"
          GENERATOR_BRANCH_HEAD="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/$RELEASE_PR_BRANCH" \
            --jq '.object.sha')"
          if [[ "$GENERATOR_PR_HEAD" != "$GENERATOR_BRANCH_HEAD" ]]; then
            echo "Generator branch head changed before cleanup" >&2
            exit 1
          fi

          gh pr edit "$RELEASE_PR_NUMBER" --remove-label "autorelease: pending"
          gh pr close "$RELEASE_PR_NUMBER"
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/$RELEASE_PR_BRANCH"

      # Regenerate changelog docs after a release PR is merged
      - if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: corepack enable
      - if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: corepack prepare pnpm@11.6.0 --activate
      - if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: corepack pnpm install --frozen-lockfile
      - if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: corepack pnpm run docs:generate
      - if: ${{ steps.release.outputs.releases_created == 'true' }}
        name: Commit post-release docs with a GitHub signature
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node scripts/create-github-signed-commit.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$DEFAULT_BRANCH" \
            --message "docs(repo): regenerate changelog and versions after release"
