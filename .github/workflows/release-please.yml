name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  pnpm_config_pm_on_fail: ignore

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # workflow_dispatch must not allow release credentials on feature refs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      # Only the protected, main-branch release job may access Doppler's
      # release-scoped Service Token. Never expose it in pull_request jobs.
      - name: Fetch release credentials from Doppler
        id: doppler_release
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
      - name: Verify release secret source
        shell: bash
        env:
          DOPPLER_PROJECT: ${{ steps.doppler_release.outputs.DOPPLER_PROJECT }}
          DOPPLER_CONFIG: ${{ steps.doppler_release.outputs.DOPPLER_CONFIG }}
          RELEASE_PLEASE_TOKEN: ${{ steps.doppler_release.outputs.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          test "$DOPPLER_PROJECT" = "kicad-studio-kit"
          test "$DOPPLER_CONFIG" = "main"
          test -n "$RELEASE_PLEASE_TOKEN"
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: release
        with:
          token: ${{ steps.doppler_release.outputs.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - id: release-pr
        name: Resolve pending Release Please generator
        env:
          GH_TOKEN: ${{ steps.doppler_release.outputs.RELEASE_PLEASE_TOKEN }}
          RELEASE_PR_JSON: ${{ steps.release.outputs.pr }}
          RELEASE_PRS_CREATED: ${{ steps.release.outputs.prs_created }}
        shell: bash
        run: |
          set -euo pipefail
          GENERATOR_BRANCH=release-please--branches--main--components--vscode-extension
          # This step runs before checkout, so gh cannot infer a repository
          # from a .git directory. Capture the command status explicitly; errors
          # must not be mistaken for "no pending generator PR".
          generator_pr_list="$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --state open --head "$GENERATOR_BRANCH" \
            --json number --jq '.[].number')"
          mapfile -t generator_prs < <(
            printf '%s\n' "$generator_pr_list" | sed '/^$/d'
          )
          if [[ "${#generator_prs[@]}" -gt 1 ]]; then
            echo "Expected at most one open Release Please generator PR" >&2
            exit 1
          fi
          # Existing proposals remain open even for unrelated root-only pushes.
          # If upstream made no change, do not enrich an old proposal head.
          if [[ -z "$RELEASE_PR_JSON" ]]; then
            if [[ "$RELEASE_PRS_CREATED" == "true" ]]; then
              echo "Release Please reported changed PRs without the expected PR payload" >&2
              exit 1
            fi
            echo "Release Please did not update a proposal; existing PR preserved"
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${#generator_prs[@]}" -eq 0 ]]; then
            echo "Release Please reported a PR but the expected generator branch is absent" >&2
            exit 1
          fi
          RELEASE_PR_NUMBER="${generator_prs[0]}"
          RELEASE_PR_HEAD="$(gh pr view "$RELEASE_PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json headRefOid --jq '.headRefOid')"
          RELEASE_TITLE="$(gh pr view "$RELEASE_PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json title --jq '.title')"
          RELEASE_TITLE="$RELEASE_TITLE" node --input-type=module <<'NODE'
          const title = process.env.RELEASE_TITLE;
          if (!/^chore\(main\): release vscode-extension [0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$/u.test(title ?? "")) {
            throw new Error("Unexpected Release Please generator title");
          }
          NODE
          if [[ -n "$RELEASE_PR_JSON" ]]; then
            RELEASE_PR_NUMBER="$RELEASE_PR_NUMBER" RELEASE_PR_HEAD="$RELEASE_PR_HEAD" \
              node --input-type=module <<'NODE'
          const parsed = JSON.parse(process.env.RELEASE_PR_JSON);
          if (parsed.number !== Number(process.env.RELEASE_PR_NUMBER) ||
              parsed.headBranchName !== "release-please--branches--main--components--vscode-extension") {
            throw new Error("Release Please output does not match the live generator PR");
          }
          NODE
          fi
          {
            echo "active=true"
            echo "number=$RELEASE_PR_NUMBER"
            echo "branch=$GENERATOR_BRANCH"
            echo "head=$RELEASE_PR_HEAD"
            echo "title=$RELEASE_TITLE"
          } >> "$GITHUB_OUTPUT"
      # One visible release PR: enrich it, rather than opening a second PR.
      - if: ${{ steps.release-pr.outputs.active == 'true' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ steps.release-pr.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - if: ${{ steps.release-pr.outputs.active == 'true' }}
        name: Verify canonical release PR head and ancestry
        env:
          GH_TOKEN: ${{ steps.doppler_release.outputs.RELEASE_PLEASE_TOKEN }}
          RELEASE_PR_NUMBER: ${{ steps.release-pr.outputs.number }}
          RELEASE_PR_HEAD: ${{ steps.release-pr.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_PR_HEAD"
          test "$(gh pr view "$RELEASE_PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')" = "$RELEASE_PR_HEAD"
          test "$(gh pr view "$RELEASE_PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRepositoryOwner --jq '.headRepositoryOwner.login')" = "oaslananka"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor origin/main "$RELEASE_PR_HEAD"; then
            echo "Canonical release PR is behind main; refusing stale generated surfaces" >&2
            exit 1
          fi
      - if: ${{ steps.release-pr.outputs.active == 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - if: ${{ steps.release-pr.outputs.active == 'true' }}
        run: corepack enable
      - if: ${{ steps.release-pr.outputs.active == 'true' }}
        run: corepack prepare pnpm@11.6.0 --activate
      - if: ${{ steps.release-pr.outputs.active == 'true' }}
        run: corepack pnpm install --frozen-lockfile
      - if: ${{ steps.release-pr.outputs.active == 'true' }}
        run: corepack pnpm run release:surface
      - if: ${{ steps.release-pr.outputs.active == 'true' }}
        run: corepack pnpm run docs:generate
      - if: ${{ steps.release-pr.outputs.active == 'true' }}
        name: Append verified generated files to the same release PR
        env:
          GITHUB_TOKEN: ${{ steps.doppler_release.outputs.RELEASE_PLEASE_TOKEN }}
          GH_TOKEN: ${{ steps.doppler_release.outputs.RELEASE_PLEASE_TOKEN }}
          RELEASE_PR_NUMBER: ${{ steps.release-pr.outputs.number }}
          RELEASE_PR_HEAD: ${{ steps.release-pr.outputs.head }}
          RELEASE_PR_BRANCH: ${{ steps.release-pr.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_PR_HEAD"
          test "$RELEASE_PR_BRANCH" = release-please--branches--main--components--vscode-extension
          test "$(gh pr view "$RELEASE_PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')" = "$RELEASE_PR_HEAD"
          # If no generated files changed, preserve the canonical PR head.
          # Nonempty generated changes are committed by GitHub with verification.
          if [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "Canonical release PR already has synchronized generated files"
            exit 0
          fi
          node scripts/create-github-signed-commit.mjs             --repository "$GITHUB_REPOSITORY"             --branch "$RELEASE_PR_BRANCH"             --message "chore(repo): sync derived release files"             --onto-head "$RELEASE_PR_HEAD"
          final_branch_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$RELEASE_PR_BRANCH" --jq '.object.sha')"
          final_pr_head=""
          for attempt in 1 2 3 4 5; do
            final_pr_head="$(gh pr view "$RELEASE_PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
            if [[ "$final_pr_head" = "$final_branch_head" ]]; then break; fi
            echo "Waiting for canonical PR head convergence (attempt $attempt/5)"
            sleep 2
          done
          test "$final_pr_head" = "$final_branch_head"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$final_pr_head" --jq '.commit.verification.verified')" = true
          echo "Verified canonical Release Please PR #$RELEASE_PR_NUMBER at $final_pr_head"

      # Regenerate changelog docs after a release PR is merged
      - if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: corepack enable
      - if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: corepack prepare pnpm@11.6.0 --activate
      - if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: corepack pnpm install --frozen-lockfile
      - if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: corepack pnpm run docs:generate
      - if: ${{ steps.release.outputs.releases_created == 'true' }}
        name: Commit post-release docs with a GitHub signature
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node scripts/create-github-signed-commit.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$DEFAULT_BRANCH" \
            --message "docs(repo): regenerate changelog and versions after release"
