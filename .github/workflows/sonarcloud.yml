name: SonarCloud CI Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    # Secrets are unavailable on fork PRs; never execute attacker-authored
    # code with the Sonar token on an untrusted fork.
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'pull_request' ||
       github.head_ref != 'release-please--branches--main--components--vscode-extension' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       github.event.pull_request.user.login != 'oaslananka')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: corepack prepare pnpm@11.6.0 --activate
      - run: corepack pnpm install --frozen-lockfile
      - name: Generate real extension Jest coverage
        run: corepack pnpm --filter kicadstudiokit run test:unit:coverage
      - name: Generate real critical-module Jest coverage
        run: >-
          corepack pnpm --filter kicadstudiokit exec jest
          --config jest.coverage-ratchet.config.js --runInBand --coverage
          --coverageReporters=lcov --coverageReporters=json-summary
      - name: Generate real repository and marketplace-script coverage with c8
        shell: bash
        run: |
          set -euo pipefail
          # Resolve the workspace-pinned CLI through pnpm rather than
          # assuming the location of node_modules or pnpm's symlink layout.
          c8_cli="$(corepack pnpm --filter kicadstudiokit exec node -p "require.resolve('c8/bin/c8.js')")"
          node "$c8_cli" \
            --reporter=lcov \
            --report-dir=apps/vscode-extension/coverage/sonar-scripts \
            --include='scripts/**/*.mjs' \
            --include='apps/vscode-extension/scripts/check-marketplace-assets.js' \
            --exclude='**/*.test.mjs' \
            node --test \
              --test-concurrency=1 \
              scripts/check-quality-gate-policy.test.mjs \
              scripts/check-nls-parity.test.mjs \
              scripts/check-docs-screenshot-freshness.test.mjs \
              scripts/check-agent-configs.test.mjs \
              scripts/check-dependency-automation-policy.test.mjs \
              scripts/check-branch-protection-gates.test.mjs \
              scripts/check-codecov-policy.test.mjs \
              scripts/check-pnpm-supply-chain.test.mjs \
              scripts/prepare-sonar-lcov.test.mjs \
              scripts/check-compatibility-contract.test.mjs \
              scripts/check-published-mcp-profiles.test.mjs \
              scripts/create-github-signed-commit.test.mjs \
              scripts/check-release-surface.test.mjs \
              scripts/check-scorecard-evidence.test.mjs \
              scripts/check-retired-dependency-evidence.test.mjs \
              scripts/verify-npm-release.test.mjs \
              scripts/check-best-practices-evidence.test.mjs \
              scripts/check-release-please-monorepo.test.mjs \
              scripts/check-signed-shadow-release.test.mjs \
              apps/vscode-extension/scripts/check-marketplace-assets.test.mjs
      - name: Rebase Jest LCOV paths to the repository root
        run: node scripts/prepare-sonar-lcov.mjs
      - name: Check LCOV evidence before upload
        shell: bash
        run: |
          set -euo pipefail
          lcov=apps/vscode-extension/coverage/lcov.info
          test -s "$lcov"
          grep -q '^SF:apps/vscode-extension/src/' "$lcov"
          critical_lcov=apps/vscode-extension/coverage/critical/lcov.info
          test -s "$critical_lcov"
          # A valid headline LCOV must not mask missing coverage on files
          # intentionally isolated in the critical-module ratchet.
          while IFS= read -r file; do
            grep -Fqx "SF:apps/vscode-extension/$file" "$critical_lcov" || {
              echo "Missing critical-module LCOV source entry" >&2
              exit 1
            }
          done < <(node -p "require('./apps/vscode-extension/coverage-scope.json').ratchet.files.join('\n')")
          script_lcov=apps/vscode-extension/coverage/sonar-scripts/lcov.info
          test -s "$script_lcov"
          grep -q '^SF:scripts/check-quality-gate-policy.mjs' "$script_lcov"
          grep -q '^SF:scripts/check-nls-parity.mjs' "$script_lcov"
          grep -q '^SF:scripts/check-docs-site.mjs' "$script_lcov"
          grep -q '^SF:scripts/check-agent-configs.mjs' "$script_lcov"
          grep -q '^SF:scripts/check-dependency-automation-policy.mjs' "$script_lcov"
          grep -q '^SF:scripts/check-branch-protection-gates.mjs' "$script_lcov"
          grep -q '^SF:scripts/check-codecov-policy.mjs' "$script_lcov"
          grep -q '^SF:scripts/check-pnpm-supply-chain.mjs' "$script_lcov"
          grep -q '^SF:scripts/prepare-sonar-lcov.mjs' "$script_lcov"
          grep -q '^SF:scripts/check-compatibility-contract.mjs' "$script_lcov"
          grep -q '^SF:scripts/check-retired-dependency-evidence.mjs' "$script_lcov"
          grep -q '^SF:scripts/verify-npm-release.mjs' "$script_lcov"
          grep -q '^SF:scripts/check-signed-shadow-release.mjs' "$script_lcov"
          grep -q '^SF:scripts/lib/github-signed-commit.mjs' "$script_lcov"
          grep -q '^SF:scripts/lib/release-surface.mjs' "$script_lcov"
          grep -q '^SF:apps/vscode-extension/scripts/check-marketplace-assets.js' "$script_lcov"
          echo "Verified headline Jest, critical Jest, and Node c8 LCOV source-file entries"
      - name: Upload analysis and LCOV to SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
