merge_queue:
  mode: serial
  max_parallel_checks: 2
  status_comments: outcomes

queue_rules:
  - name: default
    merge_method: squash
    batch_size: 1
    checks_timeout: 90 min
    branch_protection_injection_mode: queue
    queue_conditions:
      - base = main
      - -draft
      - -closed
      - -label = do-not-merge
      - -label = hold
      - -label = automerge:disabled

merge_protections_settings:
  reporting_method: check-runs
  post_comment: false
  auto_merge_conditions:
    - author = renovate[bot]
    - base = main
    - label = automerge:enabled
    - -draft
    - -closed
    - -label = automerge:disabled
    - -label = do-not-merge
    - -label = hold
    - -label = requires-review
    - -label = status/needs-review
    - -label = risk:high
    - -label = risk:medium
    - -label = runtime-risk
    - -label = compatibility
    - -label = needs:decision
    - -label = security
    - -label = type:security
    - '-files ~= ^\.github/'
    - '-files ~= ^Dockerfile$'
    - '-files ~= (^|/)docker-compose(?:\.[^.]+)?\.ya?ml$'
    - '-files ~= ^\.mergify\.ya?ml$'

merge_protections:
  - name: low-risk dependency safety
    if:
      - base = main
      - author = renovate[bot]
      - label = automerge:enabled
    success_conditions:
      - -draft
      - -closed
      - -conflict
      - -label = automerge:disabled
      - -label = do-not-merge
      - -label = hold
      - -label = requires-review
      - -label = status/needs-review
      - -label = risk:high
      - -label = risk:medium
      - -label = runtime-risk
      - -label = compatibility
      - -label = needs:decision
      - -label = security
      - -label = type:security
